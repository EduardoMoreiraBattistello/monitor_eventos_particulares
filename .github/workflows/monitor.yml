name: Monitor Foco Radical

on:
  schedule:
    # a cada 15 minutos
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar monitor
        env:
          SESSION_STATE: ${{ secrets.SESSION_STATE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python monitor.py

      - name: Salvar estado atualizado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Atualiza estado dos eventos [skip ci]"
          git push
